services:

  # ── PostgreSQL with pgvector Extension ──
  # Stores document chunks, 768d vector embeddings (HNSW index), query audit logs, and semantic cache
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mach_ai
      POSTGRES_USER: mach
      POSTGRES_PASSWORD: ai
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mach -d mach_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mach-network

  # ── Neo4j 5.x Property Graph Database ──
  # Stores hierarchical course syllabus, units, topics, prerequisite DAG, and Bloom's taxonomy mapping
  neo4j:
    image: neo4j:5.24-community
    container_name: cl-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/mach_ai_cke
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # Neo4j Browser UI
      - "7687:7687"  # Bolt Protocol Driver
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mach-network

  # ── M.A.C.H. AI FastAPI Application Server ──
  # Serves REST API endpoints, SSE chat streaming, and static frontend portals (/public)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cl-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mach_ai
      - POSTGRES_USER=mach
      - POSTGRES_PASSWORD=ai
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=mach_ai_cke
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=gemma4:12b-it-qat
      - OLLAMA_EMBED_MODEL=embeddinggemma-2:latest
      - JWT_SECRET=${JWT_SECRET:-mach-ai-default-jwt-secret-2026}
      - HEADLESS_MODE=true
      - APP_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/backend/uploads
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - mach-network

# ── Named Volumes for Persistent Storage ──
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  uploads_data:

# ── Isolated Internal Docker Bridge Network ──
networks:
  mach-network:
    driver: bridge
