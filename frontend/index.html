<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — MACH AI</title>
<link rel="icon" type="image/x-icon" href="favicon.ico?v=11">
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=11">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png?v=11">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png?v=11">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=11">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css?v=5">
<link rel="stylesheet" href="css/base.css?v=5">
<link rel="stylesheet" href="css/components.css?v=5">
<link rel="stylesheet" href="css/layout.css?v=5">
<link rel="stylesheet" href="css/page_login.css?v=5">
<link rel="manifest" href="./manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js');
  }
</script>
</head>
<body>
<div id="auth-view">

  <!-- Left: Interactive Brand Showcase -->
  <div class="auth-left">
    <a href="index.html" class="auth-top-brand" onclick="window.refreshPage && window.refreshPage(event)" title="Refresh page">
      <img src="icons/icon-192.png" alt="MACH AI" class="auth-top-icon">
      <span>M.A.C.H. AI</span>
    </a>
    <div class="auth-graph-zone">
      <canvas id="kg-canvas"></canvas>
    </div>
    <div class="auth-brand">
      <div class="auth-eyebrow">Amrita Vishwa Vidyapeetham · Coimbatore</div>
      <div class="auth-logo">M.A.C.H.</div>
      <p class="auth-tagline">Your smart academic companion. Search curriculum, trace prerequisites, explore syllabus units, and practice past exam papers with diagrams — in seconds.</p>
      <div class="auth-pills">
        <div class="auth-pill">Instant Answers</div>
        <div class="auth-pill">Visual Exam Prep</div>
        <div class="auth-pill">Smart Course Map</div>
      </div>
    </div>
  </div>

  <!-- Right: Login Form -->
  <div class="auth-right">
    <div class="login-card">
      <div class="login-card-header">
        <div class="login-card-brand-row">
          <img src="icons/icon-192.png" alt="MACH AI" class="login-card-icon">
          <h2>Sign in to MACH AI</h2>
        </div>
      </div>
      <div id="login-form-fields">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="auth-user" placeholder="Enter your username" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="auth-pass" placeholder="Enter your password" autocomplete="current-password">
      </div>
      <div class="auth-error" id="auth-error"></div>
      <div class="btn-group">
        <button class="btn btn-primary" id="btn-student" onclick="window.doLogin('student')">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
          Student
        </button>
        <button class="btn btn-outline" id="btn-admin" onclick="window.doLogin('admin')">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Admin
        </button>
      </div>
      </div>

      <div id="student-registration" style="display:none;">
        <div class="form-group"><label>Full name</label><input id="reg-name" autocomplete="name" placeholder="Your full name"></div>
        <div class="form-group"><label>College email</label><input id="reg-email" type="email" autocomplete="email" placeholder="name@college.edu"></div>
        <div class="form-group"><label>Password</label><input id="reg-password" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
        <div class="form-group"><label>Age</label><input id="reg-age" type="number" min="15" max="100" placeholder="Age"></div>
        <div class="form-group"><label>Gender</label><input id="reg-gender" placeholder="Gender"></div>
        <div class="form-group"><label>Roll number</label><input id="reg-roll" placeholder="College register number"></div>
        <div class="form-group"><label>Department</label><input id="reg-department" list="student-departments" placeholder="e.g. CSE"><datalist id="student-departments"><option value="CSE"><option value="ECE"><option value="EEE"><option value="MECH"><option value="AIE"><option value="CYS"></datalist></div>
        <div class="form-group"><label>Study year</label><select id="reg-study-year"><option value="">Select year</option><option>First year</option><option>Second year</option><option>Third year</option><option>Fourth year</option></select></div>
        <div class="form-group"><label>Admission batch / academic year</label><input id="reg-academic-year" placeholder="e.g. 2023"></div>
        <div class="form-group"><label>Semester</label><select id="reg-semester"><option value="">Select semester</option><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option><option>VI</option><option>VII</option><option>VIII</option></select></div>
        <div class="form-group"><label>Class / section</label><input id="reg-section" placeholder="e.g. F"></div>
        <div class="auth-error" id="registration-error"></div>
        <button class="btn btn-primary" id="btn-register" onclick="window.registerStudent()">Create student account</button>
      </div>
      <button type="button" id="auth-mode-toggle" class="auth-mode-toggle" onclick="window.toggleAuthMode()">New student? Create an account</button>
    </div>
  </div>

</div>
<script type="module" src="js/page_login.js?v=5"></script>
</body>
</html>
