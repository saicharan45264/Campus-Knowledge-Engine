<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Define the character set and ensure the page is responsive on mobile devices -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurriculumLens | Login</title>
    <meta name="description" content="Login to CurriculumLens">
    
    <!-- Google Fonts: Load Inter for body text and Outfit for headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Link to our custom stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <span class="logo-text">CurriculumLens</span>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="container login-container">
        <div class="card login-card">
            <h2>Portal Login</h2>
            
            <!-- Login Form -->
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Role ID (admin or student)</label>
                    <!-- 'autocomplete="off"' prevents the browser from suggesting previous inputs -->
                    <input type="text" id="username" placeholder="Enter 'admin' or 'student'" required autocomplete="off">
                </div>
                
                <button type="submit" class="primary-btn">Sign In</button>
            </form>

            <!-- Container for displaying error messages (hidden by default) -->
            <div id="login-status" class="status-message hidden"></div>
        </div>
    </main>

    <!-- Link to the external JavaScript file -->
    <script src="login.js"></script>
</body>
</html>
