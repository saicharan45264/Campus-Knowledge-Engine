# =============================================================================
# M.A.C.H. AI — Production Reverse Proxy Configuration (Nginx)
# Multimodal Academic Cognitive Hub — Amrita Vishwa Vidyapeetham Campus Network
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;

    # Maximum upload size for official institutional syllabus handbooks and question paper archives
    client_max_body_size 100M;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. HTTP to HTTPS redirection (Mandatory for Web Speech API and Media Capture)
    server {
        listen 80;
        server_name mach.amrita.edu localhost;
        return 301 https://$host$request_uri;
    }

    # 2. Secure HTTPS Server
    server {
        listen 443 ssl http2;
        server_name mach.amrita.edu localhost;

        # Institutional SSL Certificates
        ssl_certificate     /etc/ssl/certs/mach_amrita_edu.crt;
        ssl_certificate_key /etc/ssl/private/mach_amrita_edu.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Standard API and Web Application Routing
        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_connect_timeout 60s;
        }

        # Real-Time SSE Token Streaming Endpoint (Gemma 4 Reasoning & Tutoring)
        # Buffering must be disabled so tokens flow instantly to the student chat interface
        location /chat {
            proxy_pass http://backend:8000/chat;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        # Health Probe Endpoint
        location /health {
            proxy_pass http://backend:8000/health;
            access_log off;
        }
    }
}

